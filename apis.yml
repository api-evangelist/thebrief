aid: thebrief
name: TheBrief
description: >-
  The Brief (formerly Creatopy) is an AI-powered advertising creation platform that helps
  brands and agencies discover, create, launch, and optimize ads at scale. Its Ad Studio,
  AI agents (Discover, Create, Optimize), and native ad server generate on-brand creatives,
  resize a single design into 50+ ad formats, publish directly to networks like Meta, Google
  Ads, CM360, DV360 and Veeva, and optimize campaign performance with data-backed
  recommendations. Founded in 2021 and based in Romania, The Brief is a portfolio company of
  Point Nine. It ships a documented Public API on two co-equal surfaces — a REST API at
  https://api.thebrief.ai/v1 and a single GraphQL endpoint at https://graphql.thebrief.ai/public
  whose 186-type schema is readable by anonymous introspection — covering designs and templates,
  brand kits, projects and folders, exports and creatives, ad serving and ad-tag reporting, team
  users and roles, credits, and team webhooks. Authentication is a JWT bearer token minted from a
  clientId/clientSecret pair; the same signed token powers the App Integration flow that embeds
  the Ad Studio editor inside a customer's own product. No OpenAPI is published.
