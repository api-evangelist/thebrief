apis:
- name: The Brief Public REST API
  description: >-
    The Brief's versioned REST API for creative automation — list and search designs, templates
    and brand templates, read a template's editable elements and size variants, submit exports
    with element changes and collect the rendered creatives, manage projects, folders, brand kits
    (colors, fonts, logos, assets, media folders), team users and roles, share links, design
    versions, credits and team webhooks, and drive The Brief's native ad server (enable/disable
    ad tags, update settings, generate network code or CM360/DV360 CSV/XLSX trafficking files,
    and pull delivery reports). JWT bearer auth, cursor pagination, a "response" envelope, and a
    published 15 req/10s (export) / 100 req/10s (everything else) per-team rate limit.
  humanURL: https://docs.thebrief.ai/public-api/rest-api
  baseURL: https://api.thebrief.ai/v1
  tags:
  - Advertising
  - Creative Automation
  - Ad Serving
  - Design
