- name: The Brief Public GraphQL API
  description: >-
    A single POST GraphQL endpoint exposing the same data core as the REST API with arbitrary
    field selection — 48 queries and 49 mutations across designs, templates, brand kits, projects,
    folders, exports and downloads, ad networks and ad tags, A/B tests, comments, team users and
    roles, webhooks, credits and the Figma import pipeline. Anonymous __schema introspection is
    open (verified HTTP 200, 2026-08-12); executing operations requires a JWT bearer token. Six
    fields carry @deprecated directives with stated replacements — the only machine-readable
    deprecation signal The Brief publishes.
  humanURL: https://docs.thebrief.ai/public-api/graphql
  baseURL: https://graphql.thebrief.ai/public
  tags:
  - GraphQL
  - Advertising
  - Creative Automation
