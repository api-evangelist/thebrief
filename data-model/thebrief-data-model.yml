core_flow:
  name: template to served ad
  steps:
    - Pick a template (Design where isTemplate) and read its editable TemplateElements.
    - Submit element changes to generate an Export; each requested DesignSize yields one Creative.
    - Poll the Export/Creative status or receive the webhookUrl callback; download the presigned S3 url.
    - Optionally enable an ad tag on the resulting design and generate network-specific code or a CSV/XLSX trafficking file.
    - Read delivery back through the ad tag report, broken down by project, design, network, size, day or month.

