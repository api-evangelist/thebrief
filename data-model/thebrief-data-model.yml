  - {name: Comment, id: id (Int), domain: collaboration, description: A message inside a comment thread, with author and attachments.}
  - {name: SubscriptionInfo, id: id (Int), domain: commerce, description: The team subscription (planCode, planVersion, period bounds, addons, creditBalance).}
  - {name: CreditOperation, id: id (Int), domain: commerce, description: A billable operation and its credit cost (featureName, featureType, cost).}
  - {name: TeamWebhook, id: id (Int), domain: eventing, description: A team webhook subscription (name, webhookUrl) bound to one or more action types.}
  - {name: TeamWebhookActionType, id: id (Int), domain: eventing, description: A subscribable event type (name such as comment/create, description, config).}

