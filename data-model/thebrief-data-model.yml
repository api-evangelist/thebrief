  - {name: DesignVersionHistory, id: id (String), domain: creative, description: A saved version of a design size (versionName, lastModified, lastModifiedByName, sizeHash).}
  - {name: Export, id: id (UUID), domain: production, description: An asynchronous export operation carrying type, status, errorLog, applied elementsChanges, variables and the creatives it produced.}
  - {name: Download, id: id (UUID), domain: production, description: The deprecated predecessor of Export with the same shape; the download query is marked deprecated in the schema.}
