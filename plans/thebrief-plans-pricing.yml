credits:
  note: >-
    Packaged tiers are marketed as credit-free, but the API exposes a real credit ledger:
    recurring, rolling and top-up credit pools with available / locked / consumed balances,
    a per-operation credit cost list, and a team consumption report. Teams on a legacy plan
    are excluded — every /v1/credits/* route returns 400 for them.
  endpoints:
    - GET https://api.thebrief.ai/v1/credits/subscription-info
    - GET https://api.thebrief.ai/v1/credits/operations
    - GET https://api.thebrief.ai/v1/credits/team-consumption-report
  source: https://docs.thebrief.ai/public-api/rest-api/credits

