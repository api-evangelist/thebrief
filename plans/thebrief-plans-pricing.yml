description: >-
  The Brief prices by seat and workload tier, not by API call. All four published tiers include
  the full Ad Studio, AI generation and export; the pricing page states plainly "no credits.
  no counters. just plans" for the packaged tiers, while the API-side credit ledger
  (/v1/credits/*) meters actual consumption. API access as a distribution channel is named
  only under Enterprise ("Bulk distribution: API, white-label editor, CM360 / DV360 / Veeva"),
  so there is no self-serve API-only plan and no published per-request price.
